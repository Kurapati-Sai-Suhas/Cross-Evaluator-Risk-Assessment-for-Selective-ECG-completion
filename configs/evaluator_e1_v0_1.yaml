# Milestone 3a: diagnostic evaluator E1 (protocol v0.1 Sections 1, 3, 5; architecture lock v0.1 Section 2.4).
# Written BEFORE any evaluator training. All attempts below are pre-declared (owner decision O-3: at most 3).
# Eligibility floors are NOT set here: they are read from the pinned protocol (configs/protocol_v0_1.yaml).

run_name: e1_resnet1d_v0_1_run01   # never overwritten; a new run needs a new name
evaluator_id: E1
seed: 20261030                     # = protocol seed (per-attempt seeds below)
output_dir: artifacts/runs

model:
  family: resnet1d_wang            # O-4 (approved): ResNet family; layer settings in src/models/evaluators.py
  in_channels: 12                  # complete 12-lead ECG
  widths: [64, 128, 128]

input: complete                    # E1/E2 see complete ECGs only; E_dir sees masked input (separate config)

data:
  train_role: A_fit                # fitting only
  validation_role: C_dev           # early stopping, checkpoint selection, Youden threshold, eligibility
  train_window_offsets: [0, 452]   # same windows as the reconstructor (AD-8); the record label applies to both
  validation_window_offset: 0      # protocol evaluation window
  validation_masks_per_record: 8   # only used by masked-input evaluators
  cache_dir: "C:/ecg_cache/v0_1"   # same signal cache as Milestone 2c (stale-cache guard applies)

training:
  batch_size: 128
  max_epochs: 30
  early_stopping_patience: 5
  selection_metric: c_dev_macro_auroc   # mean of the CLBBB and CRBBB AUROC on C_dev; best-so-far checkpoint
  loss: bce_with_logits_pos_weight      # pos_weight = negatives / positives per output, counted on A_fit records
  mixed_precision: false

# All three attempts are run; the attempt with the best C_dev macro-AUROC is kept (protocol Section 5).
attempts:
  - {id: 1, optimizer: adam, lr: 0.001,  weight_decay: 0.0,    seed: 20261030}
  - {id: 2, optimizer: adam, lr: 0.0003, weight_decay: 0.0,    seed: 20261031}
  - {id: 3, optimizer: adam, lr: 0.001,  weight_decay: 0.0001, seed: 20261032}

operating_threshold: youden_on_C_dev   # protocol d1.evaluator_threshold_rule
