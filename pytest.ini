[pytest]
testpaths = tests
pythonpath = .
# -ra prints a short reason for every skipped test (e.g. "PTB-XL CSVs not found").
# -p no:cacheprovider: OneDrive blocks pytest's cache folder ("Access is denied"),
#   and the cache is not needed, so it is switched off.
addopts = -ra -p no:cacheprovider
# PyTorch performance note for kernel-10 'same' padding (used by L2G, D-021); not an error.
filterwarnings =
    ignore:Using padding='same' with even kernel lengths:UserWarning
